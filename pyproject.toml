[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raa-modernized"
version = "0.1.0"
description = "DH pipeline with manifest-based data paths"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "pyarrow>=24.0",
    "tomli-w>=1.0",
    "openpyxl>=3.1.2",
    "ipykernel",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    # Used by scripts/import_release.py → raa_api.editorial (HTML sanitize)
    "nh3>=0.3.6",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["data_io", "tests", "raa_life_dates*", "raa_entity_spans*", "raa_search_display*", "raa_career_patterns*"]

[tool.pytest.ini_options]
pythonpath = ["."]
