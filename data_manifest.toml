# Machine-specific: copy to data_manifest.toml and edit tier roots.
# LLM agents: add [datasets.<name>] BEFORE referencing logical_name in code.

# -----------------------------------------------------------------------------
# Policy metadata (optional)
# -----------------------------------------------------------------------------
[manifest]
version = "1.0.0"
project = "raa-modernized"
last_updated = "2026-10-14"

# -----------------------------------------------------------------------------
# Environment base directories (optional)
# -----------------------------------------------------------------------------
# If your manifest omits `[tiers.*]`, `data_io` can derive tier roots from
# `environments.<DATA_ENV>.base_dir`.
#
# Switch with:
#   export DATA_ENV=local
#   export DATA_ENV=researchcloud
[environments.local]
base_dir = "~/develop/raa-modernized/data"

[environments.researchcloud]
base_dir = "/mnt/shared/data"

[phases]
explore = "jsonl, pkl, xlsx, ad-hoc notebooks"
semi = "jsonl, markdown+yaml frontmatter"
frozen = "parquet (duckdb-queryable)"

[tiers.hot]
root = "/Users/you/develop"
mount_check = ""

[tiers.warm]
root = "/Volumes/your-warm-drive"
mount_check = "/Volumes/your-warm-drive"

[tiers.scratch]
root = "/Volumes/your-scratch-drive/scratch"
mount_check = "/Volumes/your-scratch-drive"
# Laptop fallback when the drive is unplugged: override in data_manifest.local.toml → root = "./output"

[tiers.cold]
root = "/Volumes/your-cold-archive"
mount_check = "/Volumes/your-cold-archive"

# --- datasets: one block per logical name ---

[datasets.example_input]
tier = "warm"
path = "datasets/corpus/raw_input.jsonl"
phase = "explore"
description = "Replace with your input dataset"
parent = ""

[datasets.example_output]
tier = "scratch"
path = "example_output.jsonl"
phase = "semi"
description = "Replace with your semi-structured output"
parent = "example_input"

[datasets.raa_extab]
tier = "hot"
path = "raa_convert/extab.pkl"
phase = "frozen"
description = "Consolidated RAA export (extab.pkl from raa_convert)"
parent = ""

[datasets.career_events]
tier = "scratch"
path = "career_patterns/career_events.parquet"
phase = "semi"
description = "Normalized aanstelling career events (from Postgres)"
parent = "raa_extab"

[datasets.career_sequences]
tier = "scratch"
path = "career_patterns/career_sequences.parquet"
phase = "semi"
description = "Per-person ordered career sequences with overlap groups"
parent = "career_events"

[datasets.career_transitions]
tier = "scratch"
path = "career_patterns/career_transitions.parquet"
phase = "semi"
description = "Consecutive appointment transitions (edge list)"
parent = "career_sequences"

[datasets.career_transition_matrix]
tier = "scratch"
path = "career_patterns/career_transition_matrix.parquet"
phase = "semi"
description = "Aggregated transition counts and row probabilities"
parent = "career_transitions"

[datasets.career_discontinuity_summary]
tier = "scratch"
path = "career_patterns/career_discontinuity_summary.parquet"
phase = "semi"
description = "F-RQ0 summary: influence continuity across cut vs quiet windows"
parent = "career_events"

[datasets.career_discontinuity_crossings]
tier = "scratch"
path = "career_patterns/career_discontinuity_crossings.parquet"
phase = "semi"
description = "F-RQ0 person-level pre/post cut appointments and layer moves"
parent = "career_events"
