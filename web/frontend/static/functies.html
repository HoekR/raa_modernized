<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAA — Functies</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Repertorium van Ambtenaren en Ambtsdragers</h1>
    <nav>
      <a href="/static/index.html">Personen</a>
      <a href="/static/aanstellingen.html">Aanstellingen</a>
      <a href="/static/instellingen.html">Instellingen</a>
      <a href="/static/functies.html" class="active">Functies</a>
    </nav>
    <label>
      Periode
      <select id="period"></select>
    </label>
  </header>

  <main>
    <section class="search-panel">
      <h2>Functies zoeken</h2>
      <form id="search-form">
        <label>
          Naam (wildcards * ?)
          <input type="text" name="q" placeholder="bijv. gedeputeerde*" />
        </label>
        <button type="submit">Zoeken</button>
      </form>
      <div class="az-browse-block">
        <p class="field-hint">Of blader A–Z (periode-scoped):</p>
        <div id="az-browser" class="az-browser"></div>
      </div>
    </section>

    <section>
      <p id="result-count"></p>
      <div id="pager" class="pagination"></div>
      <table id="results">
        <thead>
          <tr><th>Naam</th><th>Aanstellingen</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="pager-bottom" class="pagination"></div>
    </section>

    <section id="detail" class="entity-detail" hidden>
      <button id="back-to-results" type="button" class="back-button">Terug naar resultaten</button>
      <div id="detail-body"></div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/entity-detail.js"></script>
  <script src="/static/functies.js"></script>
</body>
</html>
