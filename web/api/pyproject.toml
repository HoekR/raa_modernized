[project]
name = "raa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "raa-modernized",
]

[tool.uv.sources]
raa-modernized = { path = "../..", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["raa_api*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
prod = [
    "gunicorn>=23.0",
]
