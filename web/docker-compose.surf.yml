# SURF / pilot: Postgres + API + nginx (+ optional import).
# Primary entry: ./scripts/surf_stack.sh (from repo root)
#
# Manual:
#   docker compose -f web/docker-compose.surf.yml --profile full up -d
#   docker compose -f web/docker-compose.surf.yml --profile import run --rm import

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: raa
      POSTGRES_PASSWORD: raa
      POSTGRES_DB: raa_modernized
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raa -d raa_modernized"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../config.local.toml:/app/config.local.toml:ro
    environment:
      DATABASE_URL: postgresql+psycopg://raa:raa@db:5432/raa_modernized
    restart: unless-stopped

  nginx:
    profiles: ["full"]
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/surf.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/ui/build:/usr/share/nginx/html/ui:ro
      - ../web/admin/build:/usr/share/nginx/html/redactie:ro
    restart: unless-stopped

  import:
    profiles: ["import"]
    build:
      context: ..
      dockerfile: web/Dockerfile.import
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../config.local.toml:/app/config.local.toml:ro
      - ../data_manifest.toml:/app/data_manifest.toml:ro
      - ../data_manifest.local.toml:/app/data_manifest.local.toml:ro
      - ${RAA_DATA_MOUNT:-/data}:/data:ro
    environment:
      DATABASE_URL: postgresql+psycopg://raa:raa@db:5432/raa_modernized
      DATA_ENV: ${DATA_ENV:-researchcloud}
    working_dir: /app

volumes:
  raa_pg:
